<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter | Lalli</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & BASE ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(145deg, #fff0f5, #ffb6c1, #ff85a2);
            color: #3e3232;
            overflow-x: hidden;
            cursor: default;
        }
        body {
            min-height: 100vh;
        }

        /* ─── CURSOR GLOW ─── */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.25) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: left 0.08s ease-out, top 0.08s ease-out;
            z-index: 9999;
            will-change: left, top;
        }

        /* ─── FLOATING BG ─── */
        .floating-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-bg span {
            position: absolute;
            font-size: 2.4rem;
            opacity: 0.20;
            animation: floatUp linear infinite;
            user-select: none;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.6);
                opacity: 0.15;
            }
            10% {
                opacity: 0.30;
            }
            90% {
                opacity: 0.30;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ─── NAVBAR ─── */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2.4rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
        }
        .navbar .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8f5f51;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            gap: 1.6rem;
            align-items: center;
        }
        .nav-links a {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a3d3d;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.25s, transform 0.25s;
            letter-spacing: 0.3px;
        }
        .nav-links a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }
        .nav-links a.active {
            opacity: 1;
            font-weight: 600;
            color: #8f5f51;
        }

        /* ─── MAIN LAYOUT ─── */
        .letter-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.6rem 4rem;
        }

        /* ─── CLICK TO READ ─── */
        .click-to-read-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease, transform 0.7s ease;
            width: 100%;
            max-width: 700px;
        }
        .click-to-read-wrapper.hidden {
            opacity: 0;
            transform: scale(0.92) translateY(30px);
            pointer-events: none;
            position: absolute;
        }

        .ctr-btn {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #e8848b, #d66a7a);
            border: none;
            border-radius: 80px;
            padding: 1.2rem 3.6rem;
            box-shadow: 0 12px 40px rgba(214, 106, 122, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            animation: pulseGlow 2.4s ease-in-out infinite;
            text-align: center;
        }
        .ctr-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 18px 50px rgba(214, 106, 122, 0.55);
        }
        .ctr-btn:active {
            transform: scale(0.94);
        }
        .ctr-btn .sub {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            opacity: 0.85;
            margin-top: 4px;
            letter-spacing: 2px;
            color: #fff5f5;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 12px 40px rgba(214, 106, 122, 0.45), 0 0 0 0 rgba(214, 106, 122, 0.25);
            }
            50% {
                box-shadow: 0 16px 56px rgba(214, 106, 122, 0.60), 0 0 0 18px rgba(214, 106, 122, 0.08);
            }
        }

        .ctr-btn .emoji-burst {
            position: absolute;
            font-size: 2.4rem;
            pointer-events: none;
            animation: burstOut 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }
        @keyframes burstOut {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.4) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.8) rotate(720deg);
            }
        }

        /* ─── LETTER PAPER (1.5x bigger) ─── */
        .letter-paper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 960px;
            /* 1.5x of 640px */
            margin: 0 auto;
            background: rgba(255, 248, 245, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 48px 48px 32px 32px;
            padding: 4rem 4.8rem 3.2rem;
            box-shadow: 0 24px 80px rgba(62, 50, 50, 0.18), 0 8px 32px rgba(62, 50, 50, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.40);
            transform: translateY(40px) scale(0.96);
            opacity: 0;
            transition: transform 0.9s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.9s ease;
            max-height: 78vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .letter-paper.visible {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .letter-paper::-webkit-scrollbar {
            width: 5px;
        }
        .letter-paper::-webkit-scrollbar-track {
            background: transparent;
        }
        .letter-paper::-webkit-scrollbar-thumb {
            background: rgba(214, 106, 122, 0.35);
            border-radius: 20px;
        }

        .letter-paper .script-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            font-weight: 600;
            color: #8f5f51;
            margin-bottom: 0.8rem;
            line-height: 1.3;
            white-space: pre-wrap;
        }

        #typedLetter {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 400;
            line-height: 1.7;
            color: #3e3232;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
            margin: 0;
        }
        #typedLetter .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #8f5f51;
            margin-left: 2px;
            animation: blink 0.85s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ─── LETTER CONTROLS ─── */
        .letter-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            margin-top: 2.4rem;
            padding-top: 1.4rem;
            border-top: 1px solid rgba(62, 50, 50, 0.08);
        }
        .letter-controls .btn {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            background: rgba(214, 106, 122, 0.12);
            border: 1px solid rgba(214, 106, 122, 0.20);
            border-radius: 40px;
            padding: 0.5rem 1.4rem;
            color: #5a3d3d;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, opacity 0.25s;
            min-width: 56px;
        }
        .letter-controls .btn:hover:not(:disabled) {
            background: rgba(214, 106, 122, 0.25);
            transform: translateY(-1px);
        }
        .letter-controls .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .letter-counter {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: #7a5f5f;
            letter-spacing: 0.5px;
            min-width: 80px;
            text-align: center;
        }

        /* ─── BUBBLE CONTAINER ─── */
        .bubble-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: bubbleRise linear infinite;
            will-change: transform, opacity;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            user-select: none;
            pointer-events: none;
        }
        @keyframes bubbleRise {
            0% {
                transform: translateY(100vh) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* ─── FOOTER ─── */
        .footer {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 2rem 1.6rem 1.4rem;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(62, 50, 50, 0.55);
            letter-spacing: 0.8px;
            margin-top: 1rem;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .letter-paper {
                max-width: 100%;
                padding: 2.4rem 1.8rem 2rem;
                border-radius: 32px;
                max-height: 72vh;
            }
            .letter-paper .script-text {
                font-size: 1.7rem;
            }
            #typedLetter {
                font-size: 1.1rem;
                line-height: 1.65;
            }
            .ctr-btn {
                font-size: 2.4rem;
                padding: 1rem 2.4rem;
            }
        }
        @media (max-width: 480px) {
            .navbar {
                padding: 0.4rem 1rem;
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .navbar .logo {
                font-size: 1.1rem;
            }
            .nav-links {
                gap: 0.6rem;
                flex-wrap: wrap;
            }
            .nav-links a {
                font-size: 0.7rem;
            }
            .ctr-btn {
                font-size: 1.8rem;
                padding: 0.8rem 1.6rem;
            }
            .ctr-btn .sub {
                font-size: 0.65rem;
            }
            .letter-paper {
                padding: 1.6rem 1.2rem 1.4rem;
                border-radius: 24px;
                max-height: 68vh;
            }
            .letter-paper .script-text {
                font-size: 1.4rem;
            }
            #typedLetter {
                font-size: 0.98rem;
                line-height: 1.6;
            }
            .letter-controls {
                gap: 1rem;
            }
            .letter-controls .btn {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
                min-width: 44px;
            }
            .letter-counter {
                font-size: 0.75rem;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── CURSOR GLOW ─── -->
    <div class="cursor-glow"></div>

    <!-- ─── FLOATING BG EMOJIS ─── -->
    <div class="floating-bg" id="floatingBg"></div>

    <!-- ─── BUBBLE CONTAINER ─── -->
    <div class="bubble-container" id="bubbleContainer"></div>

    <!-- ─── NAVBAR ─── -->
    <nav class="navbar glass">
        <a href="index.html" class="logo">Lalli</a>
        <div class="nav-links">
            <a href="memories.html">Memories</a>
            <a href="reasons.html">Reasons</a>
            <a href="letter.html" class="active">Letter</a>
            <a href="cake.html">Cake</a>
            <a href="final.html">Final</a>
        </div>
    </nav>

    <!-- ─── MAIN ─── -->
    <main class="letter-page">

        <!-- Click‑to‑Read Button -->
        <div class="click-to-read-wrapper" id="ctrWrapper">
            <button class="ctr-btn" id="ctrBtn">
                💌 Click to Read
                <span class="sub">— a love letter, just for you —</span>
            </button>
        </div>

        <!-- Letter Paper -->
        <section class="letter-paper" id="letterPaper">
            <p class="script-text" id="letterGreeting"></p>
            <div id="typedLetter"></div>

            <div class="letter-controls">
                <button class="btn prev-letter" id="prevLetterBtn" disabled>←</button>
                <span class="letter-counter" id="letterCounter">1 / 11</span>
                <button class="btn next-letter" id="nextLetterBtn" disabled>→</button>
            </div>
        </section>

    </main>

    <footer class="footer">Written with all the love words could hold ✦</footer>

    <!-- ─── CONFETTI (CDN) ─── -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1.  CURSOR GLOW
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const glow = document.querySelector('.cursor-glow');
        document.addEventListener('mousemove', (e) => {
            if (!glow) return;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2.  FLOATING BACKGROUND EMOJIS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (function initFloatingBg() {
            const container = document.getElementById('floatingBg');
            const emojis = ['🌸', '✨', '💖', '🌷', '💕', '🌟', '🌺', '💗', '🌈', '🌹', '💝', '🌻'];
            for (let i = 0; i < 30; i++) {
                const span = document.createElement('span');
                span.textContent = emojis[i % emojis.length];
                span.style.left = Math.random() * 100 + '%';
                span.style.fontSize = (1.2 + Math.random() * 2.4) + 'rem';
                span.style.animationDuration = (18 + Math.random() * 28) + 's';
                span.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(span);
            }
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3.  BUBBLE GENERATOR (after click)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const bubbleContainer = document.getElementById('bubbleContainer');
        const bubbleEmojis = ['💗', '🌸', '✨', '💖', '🌷', '💕', '🌟', '🌺', '🌈', '🌹', '💝', '🌻', '🎀', '💫', '🦋', '🌸', '💗', '✨'];

        let bubbleInterval = null;

        function spawnBubble() {
            const el = document.createElement('div');
            el.className = 'bubble';
            el.textContent = bubbleEmojis[Math.floor(Math.random() * bubbleEmojis.length)];
            const size = 1.8 + Math.random() * 2.6;
            el.style.fontSize = size + 'rem';
            el.style.left = (Math.random() * 94 + 3) + '%';
            el.style.animationDuration = (10 + Math.random() * 18) + 's';
            el.style.animationDelay = (Math.random() * 0.6) + 's';
            el.style.opacity = 0.15 + Math.random() * 0.35;
            bubbleContainer.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 30000);
        }

        function startBubbles() {
            if (bubbleInterval) return;
            for (let i = 0; i < 18; i++) setTimeout(spawnBubble, i * 180);
            bubbleInterval = setInterval(spawnBubble, 1400);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4.  LETTER DATA — reformatted with emojis, bullets, proper paragraphs
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const letters = [{
            greeting: "Happy Birthday, Meri Lala ❤️",
            text: `Lala... Aaj ka din sirf tera birthday nahi hai mere liye. Aaj mujhe tujhe sirf gifts nahi dene. Mujhe tujhe thoda sa hum dena hai. 16 June 2024 se lekar aaj tak ka thoda sa hum.

        🌸 Delhi ke woh 4 din... Teri beige t-shirt... Teri black pant... Aur meri woh cute si Lala.

        Tab mujhe bilkul nahi pata tha ki ye ladki meri life ka itna bada part ban jayegi.

        ✨ Uske baad kitni jagah aaye hum...
        • Delhi
        • Lucknow
        • Bareilly
        • Chandigarh
        • Manali
        • Hyderabad

        💕 Kitni baar lade. Kitni baar roye. Kitni baar ek dusre ko manaya. Kitni baar bas chup chaap saath baithe.

        Sab kuch perfect nahi tha. But har jagah ek cheez same thi... Tu.

        🌷 Isliye aaj jo gifts main tujhe dunga na, woh bas gifts nahi hain. Har ek ke peeche koi chhoti si baat hai.

        💖 Koi memory. Koi feeling. Kuch tera. Kuch mera. Aur bahut kuch humara.

        Main chahta hoon aaj main tujhe ek-ek cheez doon... Aur har cheez ke saath tujhe hamari koi chhoti si story yaad aaye.

        Ready hai motki? 
        Bol Haan, 
        Chal... 
        Start karte hain. ❤️`
        }, {
            greeting: "Thoda Sa Delhi 👜",
            text: `Sabse pehle... Mujhe Delhi yaad aata hai. 26 July 2024. Ek beige t-shirt. Black pant. Aur ek chhoti si moti si cute ladki.

        🌸 Tu mere liye ek purse layi thi. Shayad tujhe idea bhi nahi hai ki woh mere liye kitna special hai. Aaj bhi mere liye woh best gifts mein se ek hai. Kyunki woh tune diya tha.

        ✨ Isliye aaj main tujhe ek purse de raha hoon. Ye us purse ki jagah nahi le sakta. Bas... Delhi se shuru hui hamari story ka ek chhota sa return gift samajh le.

        Happy Birthday, Lala. ❤️`
        }, {
            greeting: "Hamari Agli Trips Ke Liye 👟",
            text: `Ye dekh ke mujhe hamari saari trips yaad aa gayi.

        🌍 Delhi • Lucknow • Chandigarh • Manali • Hyderabad

        Aur pata nahi kitni jagah abhi baaki hain. Jo shoes maine tujhe pehle diye the woh kharab ho gaye or tu aise hi jati hai lala meko phle hi dila dene chahiye the 😂 pr sorry...

        ✨ Ab dila rha... Taaki tu inhe pehen ke aur jagah jaaye. Aur mere saath aur memories banaye.

        Bas ek request hai... Is baar jaldi kharab mat karna bhaisu. 😂

        Ab ye le... 👟 ❤️`
        }, {
            greeting: "Ek Chhoti Si Cheez ❤️",
            text: `Sach bolun? Mera mann tha tere liye kuch bahut mehenga lene ka. Nahi le paya. Aur thoda bura bhi laga. Ek video bhii bnaya hai dekhna mujhse bol ke bhul jau mai to.

        🌸 But phir mujhe laga... Tujhe kabhi kisi cheez ki value uski price se nahi thi.

        💖 Tune mujhe purse diya tha or kitta kuchh diya. Tune mujhe ₹4,000 diye the jab tu khud earn nahi karti thi. Tune mujhe apna time diya. Apni care di.

        ✨ Toh ye bracelet bhi bas ek chhoti si cheez hai. Mehenga nahi hai. But mera hai. Aur tere liye hai.

        Jab bhi pehne... Apne bebu ko thoda yaad kar lena. ❤️`
        }, {
            greeting: "Meri Hardworking Lala Ke Liye 🥤",
            text: `Ye gift thoda practical hai. But reason bahut personal hai.

        🌸 Tu kitna kaam karti hai, lala or tera industrial training me jo bottle mila tha wo bhi tut gya na ? Or still tu subah kaam pe jaana. Shaam ko thak ke aana. Phir bhi mere liye time nikalna.

        💕 Kabhi kabhi mann karta hai tujhe bas apne paas rakh loon aur bolun... "Bas lala, ab kuch mat kar. Main kar lunga."

        ✨ Pata nahi kab main itna capable ban paunga. But jab tak nahi ban pata... Ye toh yaad dila hi sakta hoon ki paani peeti reh. 😂

        Apna khayal rakha kar. Tu mere liye bahut important hai. ❤️`
        }, {
            greeting: "Chhoti Chhoti Cheezein 🎀",
            text: `Isme bas chhoti-chhoti cheezein hain.

        • Nail paint
        • Clutcher

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5.  LETTER ENGINE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const letterPaper = document.getElementById('letterPaper');
        const letterGreeting = document.getElementById('letterGreeting');
        const typedLetter = document.getElementById('typedLetter');
        const prevBtn = document.getElementById('prevLetterBtn');
        const nextBtn = document.getElementById('nextLetterBtn');
        const counter = document.getElementById('letterCounter');

        let currentLetterIndex = 0;
        let isTyping = false;
        let typingInterval = null;
        let isLetterVisible = false;

        function typeLetter(index) {
            if (typingInterval) {
                clearInterval(typingInterval);
                typingInterval = null;
            }
            const letter = letters[index];
            letterGreeting.textContent = letter.greeting;
            typedLetter.textContent = '';
            isTyping = true;
            updateButtons();

            let charIndex = 0;
            const fullText = letter.text;

            // Show cursor
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            typedLetter.appendChild(cursor);

            typingInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    const ch = fullText[charIndex];
                    const textNode = document.createTextNode(ch);
                    typedLetter.insertBefore(textNode, cursor);
                    charIndex += 1;

                    // Auto-scroll to bottom if user is near bottom
                    const { scrollTop, scrollHeight, clientHeight } = letterPaper;
                    if (scrollTop + clientHeight >= scrollHeight - 60) {
                        letterPaper.scrollTop = letterPaper.scrollHeight;
                    }
                } else {
                    clearInterval(typingInterval);
                    typingInterval = null;
                    isTyping = false;
                    if (cursor.parentNode) cursor.remove();
                    updateButtons();
                }
            }, 22);

            counter.textContent = `${index + 1} / ${letters.length}`;
            updateButtons();
        }

        function updateButtons() {
            if (prevBtn) prevBtn.disabled = currentLetterIndex === 0 || isTyping || !isLetterVisible;
            if (nextBtn) nextBtn.disabled = currentLetterIndex === letters.length - 1 || isTyping || !isLetterVisible;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6.  "CLICK TO READ" HANDLER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const ctrWrapper = document.getElementById('ctrWrapper');
        const ctrBtn = document.getElementById('ctrBtn');

        ctrBtn.addEventListener('click', function(e) {
            // ── 1) Emoji burst from button ──
            const burstEmojis = ['💖', '✨', '🌸', '💗', '🌟', '🌷', '💕', '🎀', '💫', '🦋'];
            for (let i = 0; i < 16; i++) {
                const span = document.createElement('span');
                span.className = 'emoji-burst';
                span.textContent = burstEmojis[i % burstEmojis.length];
                const angle = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
                const dist = 100 + Math.random() * 180;
                span.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                span.style.setProperty('--ty', Math.sin(angle) * dist - 80 + 'px');
                span.style.fontSize = (1.6 + Math.random() * 2.2) + 'rem';
                span.style.left = '50%';
                span.style.top = '50%';
                ctrBtn.appendChild(span);
                setTimeout(() => span.remove(), 1400);
            }

            // ── 2) Confetti ──
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 160,
                    spread: 110,
                    origin: { y: 0.45, x: 0.5 },
                    colors: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a29bfe', '#f8a5c2', '#f3a683']
                });
                setTimeout(() => {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.35, x: 0.3 },
                        colors: ['#ff9ff3', '#f368e0', '#ff6b6b', '#ffd93d']
                    });
                }, 300);
                setTimeout(() => {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.35, x: 0.7 },
                        colors: ['#54a0ff', '#2ed573', '#ff9ff3', '#feca57']
                    });
                }, 500);
            }

            // ── 3) Hide button ──
            ctrWrapper.classList.add('hidden');

            // ── 4) Show letter ──
            letterPaper.classList.add('visible');
            isLetterVisible = true;

            // ── 5) Start bubbles ──
            startBubbles();

            // ── 6) Type first letter ──
            currentLetterIndex = 0;
            typeLetter(0);

            // ── 7) Update nav active state ──
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.querySelector('.nav-links a[href="letter.html"]')?.classList.add('active');
        });

        // ─── Letter navigation ───
        nextBtn?.addEventListener('click', () => {
            if (isTyping) return;
            if (currentLetterIndex < letters.length - 1) {
                currentLetterIndex++;
                typeLetter(currentLetterIndex);
            }
        });

        prevBtn?.addEventListener('click', () => {
            if (isTyping) return;
            if (currentLetterIndex > 0) {
                currentLetterIndex--;
                typeLetter(currentLetterIndex);
            }
        });

        // ─── Initial state ───
        counter.textContent = `1 / ${letters.length}`;
        updateButtons();

        // ─── Keyboard shortcuts ───
        document.addEventListener('keydown', (e) => {
            if (!isLetterVisible) return;
            if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
        });

        console.log('💌 Letter page ready — click the button to read!');
    </script>
