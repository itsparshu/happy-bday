<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cake | Toshi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & BASE ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(145deg, #fff0f5, #ffb6c1, #ff85a2);
            color: #3e3232;
            overflow-x: hidden;
            cursor: default;
            min-height: 100vh;
        }

        /* ─── CURSOR GLOW ─── */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.25) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: left 0.08s ease-out, top 0.08s ease-out;
            z-index: 9999;
            will-change: left, top;
        }

        /* ─── NAVBAR ─── */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2.4rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
        }
        .navbar .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            font-weight: 700;
            color: #8f5f51;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            gap: 1.6rem;
            align-items: center;
        }
        .nav-links a {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a3d3d;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.25s, transform 0.25s;
            letter-spacing: 0.3px;
        }
        .nav-links a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }
        .nav-links a.active {
            opacity: 1;
            font-weight: 600;
            color: #8f5f51;
        }

        /* ─── MAIN LAYOUT ─── */
        .cake-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.6rem 4rem;
            text-align: center;
        }

        .cake-page .script-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.4rem;
            font-weight: 600;
            color: #8f5f51;
            margin-bottom: 0.2rem;
        }
        .cake-page h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.6rem;
            font-weight: 700;
            color: #3e3232;
            margin-bottom: 1.6rem;
            letter-spacing: 1px;
        }

        /* ─── CAKE SECTION ─── */
        .cake-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 1.2rem 0 0.8rem;
        }

        .cake-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.35), transparent 68%);
            pointer-events: none;
            z-index: 0;
        }

        .cake-stage-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.35);
            color: #3e3232;
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            margin-bottom: 1.2rem;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.3s ease;
            z-index: 2;
            position: relative;
        }

        /* ─── CAKE ─── */
        .cake {
            position: relative;
            width: 220px;
            height: 180px;
            margin: 0 auto 1.4rem;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        /* cake layers */
        .cake-top {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 38px;
            background: linear-gradient(180deg, #f8c9d4, #f0b0c0);
            border-radius: 12px 12px 0 0;
            border: 2px solid #e8a0b0;
            border-bottom: none;
            box-shadow: inset 0 -6px 12px rgba(180, 80, 100, 0.2);
            transition: all 0.4s ease;
        }
        .cake-middle {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 34px;
            background: linear-gradient(180deg, #fad0d8, #f0b8c8);
            border-radius: 6px 6px 0 0;
            border: 2px solid #e8a0b0;
            border-bottom: none;
            box-shadow: inset 0 -6px 12px rgba(180, 80, 100, 0.15);
            transition: all 0.4s ease;
        }
        .cake-bottom {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            background: linear-gradient(180deg, #fad8e0, #f0c0d0);
            border-radius: 0 0 16px 16px;
            border: 2px solid #e8a0b0;
            border-top: none;
            box-shadow: inset 0 -6px 12px rgba(180, 80, 100, 0.12), 0 8px 24px rgba(180, 80, 100, 0.15);
            transition: all 0.4s ease;
        }

        /* plate */
        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 12px;
            background: radial-gradient(ellipse at center, #f5e8e0, #dcc8c0);
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(200, 180, 170, 0.3);
        }

        /* ─── CANDLES — positioned perfectly on top of cake ─── */
        .candles {
            position: absolute;
            top: 28px;
            /* bottom of candles aligns with top of cake layer */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 5;
            transition: all 0.8s ease;
        }
        .candle {
            position: relative;
            width: 10px;
            height: 32px;
            background: linear-gradient(180deg, #ff8a9b, #e8687a);
            border-radius: 4px 4px 2px 2px;
            box-shadow: inset -2px 0 6px rgba(0, 0, 0, 0.1);
            transform-origin: bottom center;
            transition: transform 0.5s ease;
        }
        .candle::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #ffd93d;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffd93d, 0 0 24px #ff9a3d;
            animation: flicker 0.6s ease-in-out infinite alternate;
        }
        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0.7;
            }
        }

        /* flame glow */
        .candle .flame {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 16px;
            background: radial-gradient(ellipse at bottom, #ffd93d, #ff6b35);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(1px);
            animation: flameAnim 0.5s ease-in-out infinite alternate;
            opacity: 0.9;
        }
        .candle .smoke {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: rgba(200, 200, 200, 0.15);
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0;
            transition: all 0.8s ease;
        }
        @keyframes flameAnim {
            0% {
                transform: translateX(-50%) scale(1) rotate(-4deg);
            }
            100% {
                transform: translateX(-50%) scale(0.9) rotate(4deg);
            }
        }

        /* ─── KNIFE ─── */
        .knife {
            position: absolute;
            top: 20px;
            right: -30px;
            z-index: 6;
            transform: rotate(-20deg) translateX(0);
            transition: all 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
            opacity: 0;
            pointer-events: none;
        }
        .knife.visible {
            opacity: 1;
        }
        .knife.in {
            transform: rotate(-10deg) translateX(30px) translateY(30px);
        }
        .knife-blade {
            display: block;
            width: 60px;
            height: 14px;
            background: linear-gradient(180deg, #e8e8e8, #b0b0b0);
            border-radius: 0 4px 4px 0;
            border: 1px solid #aaa;
            border-left: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .knife-handle {
            display: block;
            width: 26px;
            height: 18px;
            background: linear-gradient(180deg, #8b6b4d, #6b4d2d);
            border-radius: 4px 0 0 4px;
            border: 1px solid #5a3d2d;
            border-right: none;
            margin-top: -2px;
            box-shadow: inset -2px 0 6px rgba(0, 0, 0, 0.1);
        }

        /* ─── CUT LINE ─── */
        .cut-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 2px;
            background: rgba(200, 80, 100, 0.3);
            z-index: 4;
            transition: width 1s ease;
            pointer-events: none;
        }
        .cut-line.show {
            width: 120px;
        }

        /* ─── SLICE ─── */
        .cake-slice {
            position: absolute;
            bottom: 10px;
            right: -20px;
            width: 0;
            height: 0;
            z-index: 3;
            transition: all 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
            opacity: 0;
            pointer-events: none;
            overflow: visible;
        }
        .cake-slice.show {
            width: 70px;
            height: 70px;
            opacity: 1;
            right: -50px;
            bottom: 30px;
        }
        .cake-slice-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fad0d8, #f0b8c8);
            border-radius: 0 30px 30px 0;
            border: 2px solid #e8a0b0;
            border-left: none;
            box-shadow: 0 4px 20px rgba(180, 80, 100, 0.2);
            transform: rotate(-8deg);
            position: relative;
        }
        .cake-slice-inner::after {
            content: '🍰';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
        }

        /* ─── BLOW ANIMATION ─── */
        .cake.blow .candle .flame {
            animation: blowOut 0.6s ease forwards;
        }
        .cake.blow .candle .smoke {
            opacity: 0.6;
            animation: smokeRise 1.2s ease forwards;
        }
        .cake.blow .candle::after {
            animation: none;
            opacity: 0;
            transform: translateX(-50%) scale(0);
        }
        @keyframes blowOut {
            0% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) scale(0.2) translateY(-20px);
            }
        }
        @keyframes smokeRise {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.5) translateY(0);
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) scale(1.5) translateY(-40px);
            }
        }

        /* ─── KNIFE IN ANIMATION ─── */
        .cake.knife-in .knife {
            transform: rotate(10deg) translateX(20px) translateY(30px);
        }

        /* ─── SLICED ANIMATION ─── */
        .cake.sliced .cake-top,
        .cake.sliced .cake-middle,
        .cake.sliced .cake-bottom {
            filter: brightness(0.95);
        }
        .cake.sliced .cut-line {
            width: 120px;
        }

        /* ─── BUTTON ─── */
        .cut-cake-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #e8848b, #d66a7a);
            border: none;
            border-radius: 60px;
            padding: 0.8rem 2.8rem;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(214, 106, 122, 0.35);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, opacity 0.3s ease;
            position: relative;
            z-index: 10;
            letter-spacing: 0.5px;
            margin-top: 0.4rem;
        }
        .cut-cake-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 40px rgba(214, 106, 122, 0.45);
        }
        .cut-cake-btn:active:not(:disabled) {
            transform: scale(0.94);
        }
        .cut-cake-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(0.96);
        }

        /* ─── BALLOON CONTAINER ─── */
        #balloon-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }
        .balloon {
            position: absolute;
            bottom: -20px;
            font-size: 2.8rem;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease;
            user-select: none;
            animation: floatUp linear infinite;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
        }
        .balloon:hover {
            transform: scale(1.15);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 0.2;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        /* ─── BURST MESSAGE ─── */
        .burst-message {
            position: fixed;
            font-family: 'Dancing Script', cursive;
            font-size: 2.4rem;
            font-weight: 700;
            color: #d66a7a;
            pointer-events: none;
            z-index: 999;
            animation: messageFloat 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            text-shadow: 0 4px 24px rgba(214, 106, 122, 0.25);
        }
        @keyframes messageFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.4) rotate(-10deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-20px) scale(1.1) rotate(3deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.8) rotate(10deg);
            }
        }

        /* ─── FLOATING HEARTS ─── */
        .heart-float {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 4;
            animation: heartRise linear forwards;
            opacity: 0;
            user-select: none;
        }
        @keyframes heartRise {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.3) rotate(0deg);
            }
            15% {
                opacity: 0.9;
                transform: translateY(-10px) scale(1) rotate(10deg);
            }
            85% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.6) rotate(-20deg);
            }
        }

        /* ─── I LOVE YOU MESSAGE ─── */
        .love-message {
            position: fixed;
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            font-weight: 700;
            color: #d66a7a;
            pointer-events: none;
            z-index: 8;
            animation: loveFloat 3.2s ease forwards;
            text-shadow: 0 4px 32px rgba(214, 106, 122, 0.2);
            opacity: 0;
        }
        @keyframes loveFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.3) rotate(-8deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2) rotate(4deg);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-180px) scale(0.8) rotate(-6deg);
            }
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem 1.2rem;
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .navbar .logo {
                font-size: 1.3rem;
            }
            .nav-links {
                gap: 0.8rem;
                flex-wrap: wrap;
            }
            .nav-links a {
                font-size: 0.75rem;
            }
            .cake-page {
                padding: 5rem 1rem 3rem;
            }
            .cake-page .script-text {
                font-size: 1.8rem;
            }
            .cake-page h1 {
                font-size: 2.4rem;
            }
            .cake {
                transform: scale(0.85);
            }
            .cut-cake-btn {
                font-size: 0.9rem;
                padding: 0.6rem 2rem;
            }
            .cake-stage-text {
                font-size: 0.85rem;
                padding: 0.3rem 1.2rem;
                min-height: 2.4rem;
            }
            .love-message {
                font-size: 2rem;
            }
            .burst-message {
                font-size: 1.8rem;
            }
        }
        @media (max-width: 480px) {
            .cake {
                transform: scale(0.7);
            }
            .cake-page h1 {
                font-size: 1.8rem;
            }
            .cake-page .script-text {
                font-size: 1.4rem;
            }
            .cut-cake-btn {
                font-size: 0.8rem;
                padding: 0.5rem 1.4rem;
            }
            .love-message {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── CURSOR GLOW ─── -->
    <div class="cursor-glow"></div>

    <!-- ─── NAVBAR ─── -->
    <nav class="navbar glass">
        <a href="index.html" class="logo">Toshi</a>
        <div class="nav-links">
            <a href="cake.html" class="active">Cake</a>
            <a href="memories.html">Memories</a>
            <a href="reasons.html">Reasons</a>
            <a href="letter.html">Letter</a>
            <a href="final.html">Final</a>
        </div>
    </nav>

    <!-- ─── MAIN ─── -->
    <main class="cake-page">
        <section>
            <p class="script-text reveal" style="color: #8f5f51;">You mean the world to me</p>
            <h1 class="reveal" style="color: #3e3232;">Happy Birthday Lalli</h1>

            <div class="cake-section">
                <div class="cake-glow"></div>

                <div class="cake-stage-text" id="cakeStageText">🥳</div>

                <div class="cake" id="birthdayCake" aria-label="birthday cake cutting animation">
                    <div class="knife" id="knife" aria-hidden="true">
                        <span class="knife-blade"></span>
                        <span class="knife-handle"></span>
                    </div>

                    <div class="candles" id="candles" aria-hidden="true">
                        <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
                        <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
                        <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
                    </div>

                    <div class="cut-line" id="cutLine"></div>
                    <div class="cake-top"></div>
                    <div class="cake-middle"></div>
                    <div class="cake-bottom"></div>
                    <div class="cake-slice" id="cakeSlice">
                        <div class="cake-slice-inner"></div>
                    </div>
                    <div class="plate"></div>
                </div>

                <button class="cut-cake-btn" id="cutCakeBtn" type="button">🎂 Start Cake Cutting</button>
            </div>
        </section>

        <!-- Balloon container -->
        <div id="balloon-container"></div>
    </main>

    <!-- ─── CONFETTI ─── -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1.  CURSOR GLOW
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const glow = document.querySelector('.cursor-glow');
        document.addEventListener('mousemove', (e) => {
            if (!glow) return;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2.  CAKE CUTTING ANIMATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const cake = document.getElementById('birthdayCake');
        const cutBtn = document.getElementById('cutCakeBtn');
        const stageText = document.getElementById('cakeStageText');
        const knife = document.getElementById('knife');
        const cutLine = document.getElementById('cutLine');
        const cakeSlice = document.getElementById('cakeSlice');
        let cakeAnimationStarted = false;

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        // Show knife initially
        knife.classList.add('visible');

        cutBtn?.addEventListener('click', async () => {
            if (!cake || cakeAnimationStarted) return;

            cakeAnimationStarted = true;
            cutBtn.disabled = true;

            // ── Stage 1: Blow candles ──
            stageText.textContent = '🌬️ blowing the candles...';
            cutBtn.textContent = '🎈 Blowing Candles...';
            cake.classList.add('blow');
            await wait(1600);

            // ── Stage 2: Knife in ──
            stageText.textContent = '🔪 cutting the cake...';
            cutBtn.textContent = '✂️ Cutting...';
            cake.classList.add('knife-in');
            await wait(1400);

            // ── Stage 3: Sliced ──
            stageText.textContent = '🍰 into a slice...';
            cutBtn.textContent = '🍽️ Slicing...';
            cake.classList.add('sliced');
            cakeSlice.classList.add('show');
            await wait(1000);

            // ── Stage 4: Done ──
            stageText.textContent = '🎉 first slice for my Bubu!';
            cutBtn.textContent = '🎂 Cake Cut! 🎉';

            // ── Confetti burst ──
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 280,
                    spread: 115,
                    origin: { y: 0.55, x: 0.5 },
                    colors: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a29bfe', '#f8a5c2', '#feca57']
                });
                setTimeout(() => {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.4, x: 0.2 },
                        colors: ['#ff9ff3', '#f368e0', '#ff6b6b', '#ffd93d']
                    });
                }, 300);
                setTimeout(() => {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.4, x: 0.8 },
                        colors: ['#54a0ff', '#2ed573', '#ff9ff3', '#feca57']
                    });
                }, 500);
            }

            // ── Show "I love you" messages ──
            showLoveMessages();

            // ── Start hearts ──
            startHearts();

            // ── Start balloons if not already ──
            if (!balloonsStarted) startBalloons();

            // ── Play birthday song ──
            playBirthdaySong();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3.  "I LOVE YOU" MESSAGES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const loveMessages = [
            '💖 I Love You Lalli!',
            '🌸 You are my world!',
            '💗 Forever & Always!',
            '✨ You are magic!',
            '🌷 My heart is yours!',
            '💕 I adore you!',
            '🌟 You are my sunshine!',
            '🌺 You are precious!',
            '💖 My favorite person!',
            '🌈 You complete me!',
            '🌹 You are my rose!',
            '💝 Endless love for you!',
            '🌸 You make me smile!',
            '💗 You are my home!',
            '✨ You are everything!'
        ];

        function showLoveMessages() {
            const container = document.body;
            const usedMessages = [];

            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const msg = loveMessages[i % loveMessages.length];
                    const el = document.createElement('div');
                    el.className = 'love-message';
                    el.textContent = msg;
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.top = (10 + Math.random() * 40) + '%';
                    el.style.animationDuration = (2.8 + Math.random() * 1.2) + 's';
                    el.style.fontSize = (2 + Math.random() * 1.2) + 'rem';
                    el.style.color = ['#d66a7a', '#e8848b', '#c45a6a', '#f09aa8', '#b84a5a'][Math.floor(Math.random() * 5)];
                    container.appendChild(el);
                    setTimeout(() => { if (el.parentNode) el.remove(); }, 4500);
                }, i * 200 + 200);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4.  FLOATING HEARTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let heartsInterval = null;

        function startHearts() {
            if (heartsInterval) return;
            heartsInterval = setInterval(() => {
                const el = document.createElement('div');
                el.className = 'heart-float';
                const hearts = ['❤️', '💖', '💗', '💕', '❤️‍🔥', '💝', '✨❤️', '💖✨'];
                el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                el.style.left = (5 + Math.random() * 90) + '%';
                el.style.bottom = '-10px';
                el.style.fontSize = (1.4 + Math.random() * 2) + 'rem';
                el.style.animationDuration = (6 + Math.random() * 8) + 's';
                el.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.remove(); }, 16000);
            }, 300);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5.  BALLOONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let balloonsStarted = false;
        const balloonContainer = document.getElementById('balloon-container');

        const cuteMessages = [
            '🌸 You are magical!', '💖 Love you so much!', '✨ You glow!',
            '🌷 Simply beautiful!', '💕 You make me smile!', '🌟 You are a star!',
            '🌺 So precious!', '💗 Pure heart!', '🌈 You colour my world!',
            '🌹 My favourite!', '💝 You are loved!', '🌻 Sunshine person!',
            '🌸 You are enough!', '💖 Keep shining!', '✨ You are rare!',
            '🌷 You are joy!', '💕 You are home!', '🌟 My whole world!',
            '🌺 You are perfect!', '💗 Endless love!', '🌈 You are my rainbow!',
            '🌹 You are my rose!', '💝 You are my everything!', '🌻 Happy birthday!'
        ];

        function createBalloon() {
            const el = document.createElement('div');
            el.className = 'balloon';
            const balloons = ['🎈', '🎈', '🎈', '🎈', '🎈', '🎈', '🎈', '🎈'];
            el.textContent = balloons[Math.floor(Math.random() * balloons.length)];

            const size = 2.4 + Math.random() * 2.2;
            el.style.fontSize = size + 'rem';
            el.style.left = (2 + Math.random() * 96) + '%';

            const duration = 10 + Math.random() * 14;
            el.style.animationDuration = duration + 's';
            el.style.animationDelay = (Math.random() * 4) + 's';

            const hue = Math.floor(Math.random() * 360);
            el.style.filter = `hue-rotate(${hue}deg) drop-shadow(0 4px 12px rgba(0,0,0,0.08))`;

            // Click to burst
            el.addEventListener('click', function(e) {
                // Burst confetti
                const rect = this.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 35,
                        spread: 55,
                        origin: { x: x, y: y },
                        colors: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a29bfe']
                    });
                }

                // Floating message
                const msg = cuteMessages[Math.floor(Math.random() * cuteMessages.length)];
                const msgEl = document.createElement('div');
                msgEl.className = 'burst-message';
                msgEl.textContent = msg;
                msgEl.style.left = (x * 100 - 10) + '%';
                msgEl.style.top = (y * 100 - 20) + '%';
                document.body.appendChild(msgEl);
                setTimeout(() => { if (msgEl.parentNode) msgEl.remove(); }, 2800);

                // Remove balloon with pop
                this.style.transition = 'transform 0.2s, opacity 0.3s';
                this.style.transform = 'scale(2) rotate(20deg)';
                this.style.opacity = '0';
                setTimeout(() => { if (this.parentNode) this.remove(); }, 350);
            });

            balloonContainer.appendChild(el);

            // Auto remove after float duration
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, (duration + parseFloat(el.style.animationDelay)) * 1000 + 500);
        }

        function startBalloons() {
            if (balloonsStarted) return;
            balloonsStarted = true;

            // Initial batch
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createBalloon(), i * 250);
            }

            // Continuous spawning
            setInterval(createBalloon, 2000);
        }

        // Start balloons immediately on page load
        setTimeout(startBalloons, 800);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6.  BIRTHDAY SONG
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let audio = null;

        function playBirthdaySong() {
            try {
                if (!audio) {
                    audio = new Audio('assets/bday.mp3');
                    audio.loop = true;
                    audio.volume = 0.6;
                }
                audio.play().catch(() => {
                    // Autoplay blocked — play on next user interaction
                    document.addEventListener('click', function startAudio() {
                        if (audio) audio.play().catch(() => {});
                        document.removeEventListener('click', startAudio);
                    }, { once: true });
                });
            } catch (e) {
                console.log('Audio not available');
            }
        }

        // Try to play song on load (may be blocked)
        setTimeout(() => {
            try {
                if (!audio) {
                    audio = new Audio('assets/bday.mp3');
                    audio.loop = true;
                    audio.volume = 0.6;
                }
                audio.play().catch(() => {});
            } catch (e) {}
        }, 1000);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7.  EXTRA CONFETTI ON PAGE LOAD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        setTimeout(() => {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.3, x: 0.2 },
                    colors: ['#ff6b6b', '#ffd93d', '#ff6fb7']
                });
                setTimeout(() => {
                    confetti({
                        particleCount: 60,
                        spread: 70,
                        origin: { y: 0.3, x: 0.8 },
                        colors: ['#4d96ff', '#6bcb77', '#a29bfe']
                    });
                }, 300);
            }
        }, 600);

        console.log('🎂 Cake page ready — click the button to cut the cake!');
    </script>
</body>
</html>
